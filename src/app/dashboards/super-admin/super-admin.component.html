<!-- src/app/dashboards/super-admin/super-admin.component.html -->
<app-header [role]="loggedInUserRole"></app-header>

<div class="container mt-5">
  <h2 class="text-center mb-4">SuperAdmin Dashboard</h2>
  <p class="text-center text-muted">Welcome, {{ loggedInUserEmail }} ({{ loggedInUserRole }})!</p>

  <div class="row">
    <!-- Manage Roles & Permissions -->
    <div class="col-md-4 mb-4">
      <div class="card shadow-sm border-0 h-100">
        <div class="card-body">
          <h5 class="card-title text-primary">🔐 Manage Roles & Permissions</h5>
          <p class="card-text">Define what each role (Admin, Doctor, Receptionist, etc.) can do.</p>
          <button class="btn btn-primary btn-sm" (click)="goToManageRoles()">⚙️ Manage</button>
        </div>
      </div>
    </div>
  </div>
</div>
