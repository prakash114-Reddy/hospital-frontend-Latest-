<div class="container mt-4" style="max-width: 600px;">
  <h3 class="text-primary text-center">➕ Add Patient</h3>

  <!-- 🟢 Add form reference -->
  <form #patientForm="ngForm" (ngSubmit)="addPatient()" novalidate>

    <!-- Full Name -->
    <div class="mb-3">
      <label>Full Name</label>
      <input type="text" class="form-control" [(ngModel)]="patient.fullName" name="fullName" required #fullName="ngModel">
      <div class="text-danger mt-1" *ngIf="fullName.invalid && fullName.touched">
        Full name is required.
      </div>
    </div>

    <!-- Age -->
    <div class="mb-3">
      <label>Age</label>
      <input type="number" class="form-control" [(ngModel)]="patient.age" name="age" required min="1" #age="ngModel">
      <div class="text-danger mt-1" *ngIf="age.invalid && age.touched">
        <div *ngIf="age.errors?.['required']">Age is required.</div>
        <div *ngIf="age.errors?.['min']">Age must be at least 1.</div>
      </div>
    </div>

    <!-- Gender -->
    <div class="mb-3">
      <label>Gender</label>
      <select class="form-control" [(ngModel)]="patient.gender" name="gender" required #gender="ngModel">
        <option value="" disabled>Select Gender</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
      </select>
      <div class="text-danger mt-1" *ngIf="gender.invalid && gender.touched">
        Gender is required.
      </div>
    </div>

    <!-- Phone -->
    <div class="mb-3">
      <label>Phone</label>
      <input type="tel" class="form-control" [(ngModel)]="patient.phone" name="phone"
             pattern="^[0-9]{10}$" required #phone="ngModel">
      <div class="text-danger mt-1" *ngIf="phone.invalid && phone.touched">
        <div *ngIf="phone.errors?.['required']">Phone number is required.</div>
        <div *ngIf="phone.errors?.['pattern']">Phone must be 10 digits.</div>
      </div>
    </div>

    <!-- Address -->
    <div class="mb-3">
      <label>Address</label>
      <textarea class="form-control" [(ngModel)]="patient.address" name="address" rows="2" required #address="ngModel"></textarea>
      <div class="text-danger mt-1" *ngIf="address.invalid && address.touched">
        Address is required.
      </div>
    </div>

    <!-- Registered Date -->
    <div class="mb-3">
      <label>Registered Date</label>
      <input type="date" class="form-control" [(ngModel)]="patient.registeredDate" name="registeredDate"
             [max]="today" required #regDate="ngModel">
      <div class="text-danger mt-1" *ngIf="regDate.invalid && regDate.touched">
        Registered date is required and cannot be in the future.
      </div>
    </div>

    <!-- Username -->
    <div class="mb-3">
      <label>Username</label>
      <input type="text" class="form-control" [(ngModel)]="patient.user.username" name="username" required #username="ngModel">
      <div class="text-danger mt-1" *ngIf="username.invalid && username.touched">
        Username is required.
      </div>
    </div>

    <!-- Password -->
    <div class="mb-3">
      <label>Password</label>
      <input type="password" class="form-control" [(ngModel)]="patient.user.password" name="password" required #password="ngModel">
      <div class="text-danger mt-1" *ngIf="password.invalid && password.touched">
        Password is required.
      </div>
    </div>

    <!-- Submit -->
    <button type="submit" class="btn btn-primary w-100" [disabled]="patientForm.invalid">
      Add Patient
    </button>
  </form>
</div>
