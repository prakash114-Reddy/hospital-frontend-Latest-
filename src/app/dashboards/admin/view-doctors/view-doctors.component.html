<div class="container mt-4">
  <h3 class="text-center text-success">👨‍⚕️ All Doctors</h3>

  <div *ngIf="loading" class="text-center mt-3">
    <div class="spinner-border text-success" role="status"></div>
    <p>Loading doctors...</p>
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger">
    {{ errorMessage }}
  </div>

  <table *ngIf="doctors.length > 0" class="table table-bordered table-striped mt-4">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Experience</th>
        <th>Specialization</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let doctor of doctors">
        <td>{{ doctor?.doctorId }}</td>
        <td>{{ doctor?.doctorName }}</td>
        <td>{{ doctor?.experience }}</td>
        <td>{{ doctor?.specialization }}</td>
        <td>
          <button *ngIf="doctor?.doctorId" class="btn btn-sm btn-warning me-2" [routerLink]="['/admin/edit-doctor', doctor.doctorId]">Edit</button>
          <button *ngIf="doctor?.doctorId" class="btn btn-sm btn-danger" (click)="onDeleteDoctor(doctor.doctorId)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
