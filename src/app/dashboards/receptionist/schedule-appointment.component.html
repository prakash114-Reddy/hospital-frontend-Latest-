<div class="container mt-5 p-4 shadow rounded bg-light">
  <h4 class="text-center text-success mb-4">📅 Schedule Appointment</h4>

  <form (ngSubmit)="onSubmit()" #form="ngForm" novalidate>

    <!-- Doctor Dropdown -->
    <div class="form-group mb-3">
      <label class="form-label">👨‍⚕️ Select Doctor</label>
      <select class="form-control form-control-lg" [(ngModel)]="appointment.doctorId" name="doctorId" required>
        <option *ngFor="let doctor of doctors" [value]="doctor.doctorId">
          {{ doctor.doctorName }} (ID: {{ doctor.doctorId }})
        </option>
      </select>
    </div>

    <!-- Patient Dropdown -->
    <div class="form-group mb-3">
      <label class="form-label">🧑 Select Patient</label>
      <select class="form-control form-control-lg" [(ngModel)]="appointment.patientId" name="patientId" required>
        <option *ngFor="let patient of patients" [value]="patient.patientId">
          {{ patient.fullName }} (ID: {{ patient.patientId }})
        </option>
      </select>
    </div>

    <!-- Appointment Date -->
    <div class="form-group mb-3">
      <label class="form-label">📆 Appointment Date</label>
      <input type="date"
             class="form-control form-control-lg"
             [(ngModel)]="appointment.appointmentDate"
             [min]="today"
             name="appointmentDate"
             required>
    </div>

    <!-- Appointment Time -->
    <div class="form-group mb-3">
      <label class="form-label">⏰ Appointment Time</label>
      <input type="time"
             class="form-control form-control-lg"
             [(ngModel)]="appointment.appointmentTime"
             name="appointmentTime"
             [min]="minTime"
             [max]="maxTime"
             (ngModelChange)="validateTime()"
             required>
      <div class="text-danger mt-1" *ngIf="timeInvalid">
        Time must be between 09:00 and 18:00
      </div>
    </div>

    <!-- Reason -->
    <div class="form-group mb-4">
      <label class="form-label">📝 Reason</label>
      <textarea rows="3"
                class="form-control form-control-lg"
                [(ngModel)]="appointment.reason"
                name="reason"
                placeholder="Enter reason (optional)">
      </textarea>
    </div>

    <div class="text-center">
      <button class="btn btn-lg btn-primary px-5" [disabled]="form.invalid || timeInvalid">
        ✅ Schedule
      </button>
    </div>
  </form>
</div>
