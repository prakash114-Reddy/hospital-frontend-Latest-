<div class="container mt-5 p-4 shadow rounded bg-light" style="max-width: 600px;">
  <h4 class="text-center text-primary mb-4">💰 Generate Bill</h4>

  <form (ngSubmit)="generateBill()" #billForm="ngForm" novalidate>
    
    <!-- Appointment ID -->
    <div class="form-group mb-3">
      <label class="form-label">📋 Appointment ID</label>
      <input type="number" class="form-control form-control-lg"
             [(ngModel)]="bill.appointmentId" name="appointmentId"
             required placeholder="Enter Appointment ID">
    </div>

    <!-- Test Charges -->
    <div class="form-group mb-3">
      <label class="form-label">🧪 Test Charges (₹)</label>
      <input type="number" class="form-control form-control-lg"
             [(ngModel)]="bill.testCharge" name="testCharge"
             required placeholder="Enter Test Charges">
    </div>

    <!-- Medicine Charges -->
    <div class="form-group mb-4">
      <label class="form-label">💊 Medicine Charges (₹)</label>
      <input type="number" class="form-control form-control-lg"
             [(ngModel)]="bill.medicineCharge" name="medicineCharge"
             required placeholder="Enter Medicine Charges">
    </div>

    <div class="text-center">
      <button class="btn btn-lg btn-primary px-5" [disabled]="billForm.invalid">
        ✅ Generate Now
      </button>
    </div>
  </form>

  <!-- ✅ Show Total -->
  <div class="text-center mt-4" *ngIf="totalAmount !== null">
    <h5 class="text-success">💵 Total Bill: ₹{{ totalAmount }}</h5>
  </div>
</div>
