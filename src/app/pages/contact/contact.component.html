<div class="container py-5">
  <h2 class="text-center text-primary mb-4">📞 Contact Us</h2>
  <div class="row justify-content-center">
    <div class="col-md-6">
      <form (ngSubmit)="onSubmit()" #contactForm="ngForm">
        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-control" [(ngModel)]="contact.name" name="name" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-control" [(ngModel)]="contact.email" name="email" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Message</label>
          <textarea class="form-control" rows="4" [(ngModel)]="contact.message" name="message" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary w-100" [disabled]="!contactForm.form.valid">📨 Send Message</button>
      </form>
    </div>
  </div>
</div>
